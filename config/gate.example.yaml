api:
  listen: 127.0.0.1
  port: 18080

database:
  url: sqlite+aiosqlite:///./gate.db

discovery:
  url: https://www.vpngate.net/api/iphone/
  fallback_urls:
    - https://r.jina.ai/http://www.vpngate.net/api/iphone/
  interval_minutes: 10
  top_k_per_region: 5

selection:
  improvement_ratio: 1.15
  confirmation_rounds: 2
  switch_cooldown_minutes: 30
  active_failure_threshold: 3

automation:
  enabled: true
  health_interval_seconds: 120
  optimization_interval_minutes: 30
  max_candidates_per_cycle: 3

security:
  enabled: true
  session_hours: 12
  cookie_secure: false
  allowed_origins:
    - http://127.0.0.1:18080
    - http://localhost:18080
    - http://127.0.0.1:5173
    - http://localhost:5173

retention:
  observations_days: 7
  probes_days: 7
  completed_jobs_days: 30
  events_days: 180

regions:
  - id: jp
    name: Japan
    countries: [JP]
    socks_port: 11081
    network_index: 1
  - id: kr
    name: Korea
    countries: [KR]
    socks_port: 11082
    network_index: 2
  - id: na
    name: North America
    countries: [US, CA]
    socks_port: 11083
    network_index: 3
  - id: eu
    name: Europe
    countries: [DE, NL, FR, GB, RO, PL, ES, IT, SE, FI, CH, AT]
    socks_port: 11084
    network_index: 4
  - id: sea
    name: Southeast Asia
    countries: [SG, TH, VN, ID, MY, PH]
    socks_port: 11085
    network_index: 5
