# Managed by Gate. See docs/PROJECT_PLAN.md before editing.
global
    stats socket /run/haproxy/gate-admin.sock mode 660 level admin group gate-worker
    maxconn 4096

defaults
    mode tcp
    timeout connect 5s
    timeout client 1h
    timeout server 1h
    timeout check 3s

frontend gate_jp
    bind 127.0.0.1:11081
    default_backend gate_jp_slots

backend gate_jp_slots
    option tcp-check
    server jp-a 10.253.0.2:1080 check disabled
    server jp-b 10.253.0.6:1080 check disabled

frontend gate_kr
    bind 127.0.0.1:11082
    default_backend gate_kr_slots

backend gate_kr_slots
    option tcp-check
    server kr-a 10.253.0.10:1080 check disabled
    server kr-b 10.253.0.14:1080 check disabled

